name: Build Moonlight Linux ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debian Live ISO
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Debian Live build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools dosfstools mtools \
            grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed shim-signed \
            ca-certificates

      - name: Configure and build ISO
        run: |
          lb config
          lb build

      - name: Prepare downloadable ISO
        run: |
          mkdir -p output
          test -s live-image-amd64.hybrid.iso
          cp live-image-amd64.hybrid.iso output/Moonlight-Linux-amd64.iso
          sha256sum output/Moonlight-Linux-amd64.iso > output/SHA256SUMS.txt
          ls -lh output/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-Linux-ISO
          path: output/
          if-no-files-found: error
          retention-days: 7
