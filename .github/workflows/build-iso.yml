name: Build Moonlight Linux ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debian Live ISO
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install Debian Trixie build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates live-build debootstrap xorriso squashfs-tools \
            dosfstools mtools grub-pc-bin grub-efi-amd64-bin \
            grub-efi-amd64-signed shim-signed

      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate shell scripts
        run: |
          set -eu
          sh -n auto/config
          sh -n config/hooks/normal/0500-opera-gx.hook.chroot
          for script in config/includes.chroot/usr/bin/*; do
            case "$(head -n 1 "$script")" in
              '#!/bin/bash') bash -n "$script" ;;
              *) sh -n "$script" ;;
            esac
          done

      - name: Validate Debian Trixie package manifest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(sed 's/#.*//' config/package-lists/*.list.chroot | awk 'NF { print $1 }')
          apt-get install --simulate --no-install-recommends "${packages[@]}"

      - name: Configure and build ISO
        run: |
          chmod +x auto/config
          lb config
          lb build

      - name: Prepare downloadable ISO
        run: |
          mkdir -p output
          test -s live-image-amd64.hybrid.iso
          cp live-image-amd64.hybrid.iso output/Moonlight-Linux-amd64.iso
          chmod 644 output/Moonlight-Linux-amd64.iso
          sha256sum output/Moonlight-Linux-amd64.iso > output/SHA256SUMS.txt
          ls -lh output/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-Linux-ISO
          path: output/
          if-no-files-found: error
          retention-days: 7
